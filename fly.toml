# fly.toml app configuration file generated for djilogparser on 2026-05-02T06:14:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djilogparser'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
